name: nieuwsradar

services:
  # --- Feeds verzamelen -------------------------------------------------
  miniflux-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: miniflux
      POSTGRES_PASSWORD: ${MINIFLUX_DB_PASSWORD}
      POSTGRES_DB: miniflux
    volumes:
      - miniflux-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "miniflux"]
      interval: 10s
      retries: 5

  miniflux:
    image: miniflux/miniflux:latest
    restart: unless-stopped
    depends_on:
      miniflux-db:
        condition: service_healthy
    ports:
      - "8281:8080"
    environment:
      DATABASE_URL: "host=miniflux-db port=5432 user=miniflux password=${MINIFLUX_DB_PASSWORD} dbname=miniflux sslmode=disable"
      RUN_MIGRATIONS: "1"
      CREATE_ADMIN: "1"
      ADMIN_USERNAME: ${MINIFLUX_ADMIN_USER}
      ADMIN_PASSWORD: ${MINIFLUX_ADMIN_PASSWORD}
      # Feeds elke MINIFLUX_POLL_MINUTES minuten verversen (Miniflux-standaard is 60)
      POLLING_FREQUENCY: ${MINIFLUX_POLL_MINUTES:-5}
      SCHEDULER_ROUND_ROBIN_MIN_INTERVAL: ${MINIFLUX_POLL_MINUTES:-5}
      BATCH_SIZE: "200"
      BASE_URL: ${MINIFLUX_BASE_URL:-http://localhost:8281}

  # Maakt feeds van sites zonder RSS (optioneel)
  rsshub:
    image: diygod/rsshub:latest
    restart: unless-stopped
    ports:
      - "8283:1200"
    environment:
      NODE_ENV: production
      CACHE_TYPE: memory

  # --- Lokale AI voor clustering en samenvattingen ---------------------
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    # Heb je een NVIDIA-GPU? Haal dan het commentaar hieronder weg.
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  ollama-pull:
    image: ollama/ollama:latest
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 5
        ollama pull ${EMBED_MODEL:-bge-m3}
        if [ -n "${LLM_MODEL}" ]; then ollama pull ${LLM_MODEL}; fi
        if [ -n "${TRANSLATE_MODEL}" ]; then ollama pull ${TRANSLATE_MODEL}; fi
    restart: "no"

  # --- Pushmeldingen -----------------------------------------------------
  # Optioneel: alleen nodig als je naast de PWA ook de ntfy-app wilt gebruiken.
  # Aanzetten: COMPOSE_PROFILES=ntfy en NTFY_URL=http://ntfy:80
  ntfy:
    image: binwiederhier/ntfy:latest
    profiles: ["ntfy"]
    restart: unless-stopped
    command: serve
    ports:
      - "8282:80"
    environment:
      NTFY_BASE_URL: ${NTFY_PUBLIC_URL:-http://localhost:8282}
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: ${NTFY_DEFAULT_ACCESS:-read-write}
      NTFY_BEHIND_PROXY: "true"
    volumes:
      - ntfy-cache:/var/cache/ntfy
      - ntfy-lib:/var/lib/ntfy

  # --- De radar zelf: controle, pushregels en PWA ------------------------
  radar:
    # Kant-en-klare image, gebouwd door GitHub Actions (.github/workflows/docker.yml).
    # Zelf bouwen: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
    image: ghcr.io/denniedp-debug/nieuwsradar:latest
    restart: unless-stopped
    depends_on: [miniflux, ollama]
    ports:
      - "8280:8080"
    environment:
      MINIFLUX_URL: http://miniflux:8080
      MINIFLUX_API_KEY: ${MINIFLUX_API_KEY}
      OLLAMA_URL: http://ollama:11434
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      LLM_MODEL: ${LLM_MODEL:-}
      TRANSLATE: ${TRANSLATE:-false}
      TRANSLATE_MODEL: ${TRANSLATE_MODEL:-}
      NTFY_URL: ${NTFY_URL:-}            # bijv. http://ntfy:80; leeg = alleen Web Push
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      NTFY_TOPIC: ${NTFY_TOPIC:-nieuwsradar}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      PUBLIC_URL: ${RADAR_PUBLIC_URL:-http://localhost:8280}
      RADAR_INTERVAL: ${RADAR_INTERVAL:-120}   # seconden tussen radar-rondes
      TZ: Europe/Amsterdam
    volumes:
      - radar-data:/data
    # config.yaml zit in de image: wijzig hem in GitHub en doe "Pull and redeploy" in Portainer.

volumes:
  miniflux-db:
  ollama:
  ntfy-cache:
  ntfy-lib:
  radar-data:
